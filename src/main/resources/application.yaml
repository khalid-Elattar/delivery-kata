spring:
  application:
    name: delivery

  # R2DBC PostgreSQL
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/delivery
    username: postgres
    password: postgres
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 30m

  # Liquibase configuration (requires explicit JDBC connection for R2DBC apps)
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:5432/delivery
    user: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    # drop-first forces Liquibase to drop and recreate all objects - use temporarily for setup
    drop-first: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # Kafka
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          slot-created:com.crafteam.delivery.domain.event.SlotCreatedEvent,
          slot-booked:com.crafteam.delivery.domain.event.SlotBookedEvent,
          booking-confirmed:com.crafteam.delivery.domain.event.BookingConfirmedEvent,
          booking-cancelled:com.crafteam.delivery.domain.event.BookingCancelledEvent
    consumer:
      group-id: delivery-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.crafteam.delivery.domain.event

# Server
server:
  port: 8080

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:changeme-this-is-a-very-long-secret-key-for-jwt-signing-must-be-at-least-512-bits}
  access-token:
    expiration-ms: 3600000  # 1 hour in milliseconds
  refresh-token:
    expiration-days: 30  # 30 days

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging is configured via logback-spring.xml for structured logging
# Only specify the log path here
logging:
  file:
    path: logs

# Custom properties - Delivery Business Rules
delivery:
  booking:
    max-active-per-user: 3
    cancellation-deadline-hours: 1

  modes:
    drive:
      slot-duration: 60  # minutes
      start-time: "08:00"
      end-time: "20:00"
      min-advance-hours: 2
      max-advance-days: 14
      default-capacity: 10
      available-days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY

    delivery:
      slot-duration: 120
      start-time: "09:00"
      end-time: "21:00"
      min-advance-hours: 24
      max-advance-days: 7
      default-capacity: 5
      available-days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY

    delivery-today:
      slot-duration: 60
      start-time: "10:00"
      end-time: "22:00"
      min-advance-hours: 3
      max-advance-days: 0
      default-capacity: 3
      cutoff-time: "19:00"
      available-days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY

    delivery-asap:
      slot-duration: 30
      start-time: "08:00"
      end-time: "23:00"
      min-advance-minutes: 30
      max-advance-hours: 4
      default-capacity: 2
      available-days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY

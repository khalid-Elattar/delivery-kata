databaseChangeLog:
  - changeSet:
      id: 002-create-slots-table
      author: crafteam
      changes:
        - createTable:
            tableName: slots
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: delivery_mode
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: capacity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: booked_count
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE slots ADD CONSTRAINT chk_capacity CHECK (capacity > 0);
              ALTER TABLE slots ADD CONSTRAINT chk_booked_count CHECK (booked_count >= 0 AND booked_count <= capacity);
              ALTER TABLE slots ADD CONSTRAINT chk_time_order CHECK (end_time > start_time)

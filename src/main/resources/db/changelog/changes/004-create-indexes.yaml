databaseChangeLog:
  - changeSet:
      id: 004-create-indexes
      author: crafteam
      changes:
        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_slots_delivery_mode_date
            tableName: slots
            columns:
              - column:
                  name: delivery_mode
              - column:
                  name: date
        - createIndex:
            indexName: idx_bookings_user_id
            tableName: bookings
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_bookings_slot_id
            tableName: bookings
            columns:
              - column:
                  name: slot_id
        - createIndex:
            indexName: idx_bookings_status
            tableName: bookings
            columns:
              - column:
                  name: status
